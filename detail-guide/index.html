<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디테일 가이드 - 법적 고지</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: white;
        }

        h1 {
            color: #1a1a2e;
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            display: block;
            padding: 20px 24px;
            background: #f8f9fa;
            border-radius: 12px;
            text-decoration: none;
            color: #1a1a2e;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .link-card:hover {
            background: #fff;
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.2);
        }

        .link-card h2 {
            font-size: 18px;
            margin-bottom: 4px;
        }

        .link-card p {
            font-size: 13px;
            color: #888;
        }

        .footer {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 24px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">DG</div>
        <h1>디테일 가이드</h1>
        <p class="subtitle">인테리어 공사 관리 및 소통 앱</p>

        <div class="links">
            <a href="privacy-policy.html" class="link-card">
                <h2>개인정보처리방침</h2>
                <p>개인정보 수집 및 이용에 관한 안내</p>
            </a>

            <a href="terms-of-service.html" class="link-card">
                <h2>이용약관</h2>
                <p>서비스 이용에 관한 약관</p>
            </a>
        </div>

        <div class="footer">
            <p>&copy; 2026 디테일 가이드. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
